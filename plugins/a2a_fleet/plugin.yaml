name: a2a_fleet
version: "0.12.0"
description: "A2A fleet membership over JSON-RPC: embedded A2A server + fleet_send outbound tool, with echo/llm/agent inbound handlers (agent = real Hermes agent via platform adapter) + managed repo-scoped executor deployment for Claude Code, OpenCode, Codex CLI, and Google Antigravity CLI. v0.4 config bootstrap scaffolds fleet.yaml on first enable and auto-wires managed peers surgically; v0.5 adds a read-only dashboard API (/api/plugins/a2a_fleet/conversations); v0.6 adds OpenCode receiver deploy/status/stop, mode-aware fleet.yaml loading/upsert, and boot-reconcile for all managed executor modes; v0.7 adds Codex CLI receiver (mode: codex, port 9311, sandbox param, thread-based multi-turn via codex exec resume); v0.8 adds Google Antigravity CLI receiver (mode: agy, port 9313, boolean sandbox toggle, NO model selection, plain-text multi-turn via agy --conversation with prefix-strip transcript-tail extraction, requires interactive `agy` sign-in once); v0.8.1 makes the dashboard mode-aware: all four managed modes (claude_code, opencode, codex, agy) appear in the conversations/peers tab with per-mode transcript resolution and a mode field in every response. v0.8.2 backports two hardening fixes to cc and oc receivers: clear stale session_id before remint in oc_receiver (#82) and sanitize forbidden extra_flags in both cc_receiver and oc_receiver (#86). v0.8.3 security: llm.system_prompt_file path-traversal guard (#84) — resolved path must be within get_hermes_home(); regression guard for deploy_*_receiver repo_path in schema required (#72). v0.8.4 security: reject !!python/ YAML tags in fleet.yaml to close RCE primitive via ruamel round-trip constructor (#83) — _yaml() now registers a multi-constructor that raises ConstructorError for any tag:yaml.org,2002:python/ prefix, blocking arbitrary-Python execution while preserving comment round-trip. v0.8.5 gives each managed mode a dedicated 10-port band (claude_code 9300-9309, opencode 9310-9319, codex 9320-9329, agy 9330-9339) and auto-allocates a free port within the band when bind_port is omitted (reusing this repo's existing port on re-deploy, skipping ports claimed by other repos' peers) so multiple same-mode receivers across repos no longer collide; codex default moves 9311->9320 and agy 9313->9330. v0.8.6 fixes the dashboard read-only API (_managed_repos) to dedup managed peers by (repo_path, mode) instead of repo_path alone, so multiple modes in one repo (e.g. cc + codex) all surface in the conversations/peers feed and Matrix3D instead of all-but-the-first being silently dropped (#95). v0.8.7 brings the opencode, codex, and agy executors up to claude_code tool-parity: all three receiver runners now augment PATH with common tool dirs (gh/git/node resolve under a launchd daemon); codex passes the prompt as a positional arg AND closes stdin (stdin=DEVNULL) so codex-cli >=0.136 stops blocking rc=1 on stdin (#97); opencode uses its default full-tool primary agent (no forced --agent) so file/bash/gh work (#99); agy gains --add-dir <repo> + a raised --print-timeout (default 15m) so it executes tools to completion instead of returning a plan and timing out at 5m (#100). opencode + agy verified live running `gh issue list`; codex fix is unit + falsification verified, live re-verify pending codex-cli auth. v0.8.8 (Codex review follow-up) fixes agy's _subprocess_runner to actually launch with env=_tool_env() (it was still using raw os.environ for real turns) and normalizes --print-timeout via a single _print_timeout_s() helper (ceil, min 1s) so the receiver backstop invariant holds for fractional/tiny budgets, plus the agy runner-env regression test. Anti-loop is enforced orchestrator-side (Hermes); receivers enforce per-context serialization, concurrency, and idle-timeout. v0.9.0 adds READ-ONLY Herdr session tools (herdr_status, herdr_list_sessions, herdr_inspect_session) that inspect already-running Herdr-managed agent panes via the herdr CLI's JSON envelope — no socket protocol reimplementation, no pane-content parsing (guard-tested), no mutation verbs. Remote hosts go through `herdr --remote <ssh_target>`, which owns its own 0600 bridge socket; nothing is exposed over TCP. Config layer generalized so a portless/tokenless peer is representable: herdr_session lives in a SIBLING constant SUPPORTED_HERDR_MODES, never in SUPPORTED_MANAGED_MODES (which stays byte-identical), so port bands, allocate_band_port, transcript_filename_for, and stable_token_env_name are untouched; _validate_peer_url is skipped only for managed herdr peers; herdr peers declaring token_env/repo_path are rejected rather than silently ignored; fleet.herdr (policy + hosts + allowed_workspaces) is now surfaced as cfg['herdr'] instead of being silently dropped by load_fleet; client.send_message gained a portless-handler seam leaving the httpx path byte-identical. Herdr tool registration is wrapped so a Herdr fault can never abort fleet_send / managed-executor registration. v0.10.0 adds Phase 2 confirmation-gated Herdr actions: herdr_preview_action mints a single-use, short-lived token bound to the session's revision; herdr_request_action spends it, refuses if the revision moved, and never retries (herdr agent send has no request ID, so an unknown outcome stays unknown). Mutations are off until a host sets allow_actions: true. Bindings, tokens, and an append-only audit trail live in SQLite in the profile state.db, not the in-memory ContextStore, so they survive a gateway restart like the Herdr sessions themselves do. Human takeover is a Fleet-side pause: Herdr's --source is a fixed allowlist and ('herdr:hermes','hermes') is session-identity-only, so Herdr discards authority reports from Hermes — Fleet reads authority state and never claims it. v0.11.0 adds Phase 3 routing: herdr_receiver.py fills the portless fleet_send seam, resolving a herdr peer's host_alias+workspace+agent_kind to exactly one session, refusing ambiguity rather than picking, keeping an already-bound context on its own pane, and returning a dispatch receipt instead of pretending to carry the session's answer. It also corrects the revision guard: revision is a presentation counter (terminal title + metadata tokens), NOT an output counter, so it is blind for sessions that never set a title — verified live when a bash pane took delivered text at revision 0 and accepted a stale token. preview and send now report revision_guard: active|blind|unavailable, so a check that saw nothing is never mistaken for a check that passed. v0.12.0 makes confirmed actions actually submit: herdr_request_action now calls Herdr's atomic `agent prompt` verb, which writes the text AND schedules its Enter, instead of `agent send`, which inserted the text and left it unsubmitted in the CLI composer while the tool reported success. Chosen over composing send + a separate ENTER keystroke because the submission encoding is per-runtime, Herdr enforces preconditions we cannot see (it refuses when the agent is no longer the pane's foreground process), the text/Enter delay is a race Herdr already handles, and `agent prompt` takes (target, text) with no key list — so no arbitrary-key injection route exists. Status is now `submitted`, `submission_rejected` (Herdr refused before writing anything, so nothing is in the composer), or `draft_inserted_submission_unknown` (never retried — a second attempt could double-submit)."
author: Interstellar-code
kind: standalone

# Tool this plugin registers with the Hermes agent.
provides_tools:
  - fleet_send
  - herdr_status
  - herdr_list_sessions
  - herdr_inspect_session
  - herdr_preview_action
  - herdr_request_action
  - herdr_claim_human_takeover
  - herdr_release_human_takeover

# Environment variables read at runtime.
# Token env names are dynamic: each peer's token_env key in fleet.yaml names the
# environment variable that holds that peer's pre-shared bearer token.
# Convention: use <PEER_NAME>_A2A_TOKEN (e.g. CONSTRUCT_A2A_TOKEN, SWITCH_A2A_TOKEN).
# The self-server token_env (fleet.server.token_env) follows the same pattern.
# Example required env vars for a two-peer fleet:
#   SWITCH_A2A_TOKEN    — bearer token for this node's inbound requests
#   CONSTRUCT_A2A_TOKEN — bearer token this node uses to call the "construct" peer
# No variables are hard-coded here because each deployment's fleet.yaml determines
# which names are active.
requires_env: []
